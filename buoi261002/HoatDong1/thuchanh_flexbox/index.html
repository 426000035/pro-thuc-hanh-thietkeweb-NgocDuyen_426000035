<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">
  <title>Đăng nhập | Mộc Coffee</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand" href="#" aria-label="Mộc Coffee - Trang chủ">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>MỘC <span class="brand-light">COFFEE</span></span>
      </a>

      <div class="intro">
        <p class="eyebrow">Rất vui được gặp bạn</p>
        <h1 id="login-title">Một tách cà phê,<br>một ngày thật lành.</h1>
        <p class="intro-copy">Đăng nhập để tiếp tục hành trình thưởng thức của bạn.</p>
      </div>

      <form class="login-form" action="#" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="ban@email.com" autocomplete="email" required>

        <div class="password-heading">
          <label for="password">Mật khẩu</label>
          <a href="#">Quên mật khẩu?</a>
        </div>
        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>

        <label class="remember-option">
          <input type="checkbox" name="remember">
          <span>Ghi nhớ đăng nhập</span>
        </label>

        <button type="submit">Đăng nhập <span aria-hidden="true">&#8594;</span></button>
      </form>

      <p class="signup">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
      <p class="card-note">Pha chậm một chút, tận hưởng nhiều hơn.</p>
    </section>
  </main>
</body>
</html>
