<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gallery-container">
        <h1>Thư Viện Ảnh - Grid Gallery</h1>
        <div class="gallery">
            <div class="gallery-item item-large">
                <img src="https://picsum.photos/id/1015/800/800" alt="Phong cảnh 1">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1016/400/400" alt="Phong cảnh 2">
            </div>
            <div class="gallery-item item-tall">
                <img src="https://picsum.photos/id/1018/400/800" alt="Phong cảnh 3">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1019/400/400" alt="Phong cảnh 4">
            </div>
            <div class="gallery-item item-wide">
                <img src="https://picsum.photos/id/1020/800/400" alt="Phong cảnh 5">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1021/400/400" alt="Phong cảnh 6">
            </div>
            <div class="gallery-item item-large">
                <img src="https://picsum.photos/id/1022/800/800" alt="Phong cảnh 7">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1023/400/400" alt="Phong cảnh 8">
            </div>
            <div class="gallery-item item-tall">
                <img src="https://picsum.photos/id/1024/400/800" alt="Phong cảnh 9">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1025/400/400" alt="Phong cảnh 10">
            </div>
        </div>
    </div>
</body>
</html>
