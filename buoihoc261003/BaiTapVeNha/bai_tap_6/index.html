<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỹ năng | Web Developer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="skills">
    <header class="skills__head">
      <p class="tag">Portfolio</p>
      <h1>Kỹ năng của tôi</h1>
      <p class="intro">Hơn 3 năm làm web từ giao diện đến logic phía người dùng. Mỗi thanh dưới đây thể hiện mức độ thành thạo hiện tại.</p>
    </header>

    <div class="panels">

      <!-- Nhóm 1 -->
      <section class="panel" aria-labelledby="front-title">
        <h2 id="front-title">Front-end</h2>

        <ul class="list">
          <li class="skill" style="--value: 90; --i: 0; --c1: #f97316; --c2: #ec4899;">
            <div class="skill__top">
              <span class="skill__name">HTML5</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="HTML5" aria-valuemin="0" aria-valuemax="100" aria-valuenow="90">
              <span class="bar__fill"></span>
            </div>
          </li>

          <li class="skill" style="--value: 85; --i: 1; --c1: #3b82f6; --c2: #8b5cf6;">
            <div class="skill__top">
              <span class="skill__name">CSS3 &amp; Animation</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="CSS3 và Animation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="85">
              <span class="bar__fill"></span>
            </div>
          </li>

          <li class="skill" style="--value: 75; --i: 2; --c1: #fcd34d; --c2: #f59e0b;">
            <div class="skill__top">
              <span class="skill__name">JavaScript</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="JavaScript" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75">
              <span class="bar__fill"></span>
            </div>
          </li>

          <li class="skill" style="--value: 70; --i: 3; --c1: #22d3ee; --c2: #3b82f6;">
            <div class="skill__top">
              <span class="skill__name">React</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="React" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
              <span class="bar__fill"></span>
            </div>
          </li>
        </ul>
      </section>

      <!-- Nhóm 2 -->
      <section class="panel" aria-labelledby="tool-title">
        <h2 id="tool-title">Công cụ &amp; Thiết kế</h2>

        <ul class="list">
          <li class="skill" style="--value: 80; --i: 4; --c1: #8b5cf6; --c2: #ec4899;">
            <div class="skill__top">
              <span class="skill__name">Responsive Design</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="Responsive Design" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
              <span class="bar__fill"></span>
            </div>
          </li>

          <li class="skill" style="--value: 65; --i: 5; --c1: #ec4899; --c2: #f97316;">
            <div class="skill__top">
              <span class="skill__name">Figma</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="Figma" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65">
              <span class="bar__fill"></span>
            </div>
          </li>

          <li class="skill" style="--value: 72; --i: 6; --c1: #f97316; --c2: #ef4444;">
            <div class="skill__top">
              <span class="skill__name">Git &amp; GitHub</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="Git và GitHub" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
              <span class="bar__fill"></span>
            </div>
          </li>

          <li class="skill" style="--value: 60; --i: 7; --c1: #22c55e; --c2: #3b82f6;">
            <div class="skill__top">
              <span class="skill__name">SEO cơ bản</span>
              <span class="skill__num" aria-hidden="true"></span>
            </div>
            <div class="bar" role="progressbar" aria-label="SEO cơ bản" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
              <span class="bar__fill"></span>
            </div>
          </li>
        </ul>
      </section>

    </div>
  </main>

</body>
</html>
